<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Base</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Base">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Lato:wght@400;700;900&family=Oswald:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column app, bottom tab bar, bottom sheets. One committed light look from the approved mockup. */
:root{
  --papaya:#E8602C; --lime:#C3C536; --iris:#EFCEEE; --bubble:#F06FBE; --sea:#BFDBD8; --tide:#0F7A96;
  --ink:#10262D; --muted:#6d7378; --faint:#9aa0a4; --line:#ececec; --soft:#F4F4F2; --white:#ffffff;
  --font:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPhone zooms into any field with text under 16px; keep every field at 16px so the app stays put */
input,textarea,select,.input{font-size:16px!important}
:root{padding-top:env(safe-area-inset-top,0px)}
.login{position:fixed;inset:0;z-index:100;background:var(--white);display:flex;align-items:center;justify-content:center;padding:24px}
.login form:not([hidden]){width:100%;max-width:360px;display:grid;gap:14px;justify-items:stretch}
.login form img{justify-self:center}
.login h1{margin:0;text-align:center;font-size:28px;font-weight:600}
.recbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border-radius:999px;padding:16px;background:var(--white);color:var(--ink);font-size:17px;font-weight:600;position:relative}
.recbtn svg{width:26px;height:26px}
.recbtn.rec{background:var(--papaya);color:var(--white)}
.recbtn.busy{opacity:.75}
@media (prefers-reduced-motion:no-preference){.recbtn.rec{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}}
html,body{height:100%}
body{background:var(--iris);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--tide);outline-offset:2px;border-radius:8px}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--white);position:relative;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:500px){.app{border-left:3px solid var(--ink);border-right:3px solid var(--ink)}}
.view{padding-inline:16px;padding-block:16px 24px;display:grid;gap:14px}
.h{font-weight:600;letter-spacing:-.01em}
.nw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lb{font-size:12px;color:var(--muted);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:0 0 auto}
.av.n{background:var(--bubble)} .av.c{background:var(--tide);color:var(--white)}
.av.sm{width:20px;height:20px;font-size:11px}
.blob{position:absolute;border-radius:58% 42% 50% 50% / 50% 60% 40% 50%;pointer-events:none}
.card{border-radius:22px;padding:16px;position:relative;overflow:hidden}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:4px}
.sec-h h2{font-size:17px;margin:0;font-weight:600}
.link{font-size:13px;color:var(--tide);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.p-work{background:var(--sea)} .p-home{background:var(--lime)} .p-bonnie{background:var(--bubble)} .p-colin{background:var(--iris)} .p-late{background:var(--papaya);color:var(--white)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border-radius:999px;padding:6px 13px;font-size:13px;background:var(--soft);white-space:nowrap;flex:0 0 auto}
.chip.on{background:var(--ink);color:var(--white)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:13px;min-height:88px;display:flex;flex-direction:column;text-align:left}
.tile i{font-size:20px}
.tile .n{font-size:24px;font-weight:600;line-height:1;margin-top:auto}
.tile .t{font-size:12px;margin-top:2px}
.list{display:grid}
.it{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.it:last-child{border-bottom:0}
.ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--ink);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--white)}
.ck.round{border-radius:50%}
.ck.on{background:var(--ink)}
.ck i{font-size:14px}
.it .body{flex:1;min-width:0}
.it .tt{font-size:15px}
.it.done .tt{text-decoration:line-through;color:var(--faint)}
.it .meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.btn{border-radius:999px;padding:11px 18px;font-weight:500;font-size:14px;text-align:center}
.btn.ink{background:var(--ink);color:var(--white)}
.btn.pap{background:var(--papaya);color:var(--white)}
.btn.line{border:2px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px}
.empty{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--soft);font-size:14px;color:var(--muted)}
.input{width:100%;border:2px solid var(--ink);border-radius:14px;padding:11px 13px;background:var(--white)}
textarea.input{resize:vertical;min-height:96px;line-height:1.45}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:7px 13px;font-size:13px;background:var(--soft)}
.seg button.on{background:var(--ink);color:var(--white)}
label.f{display:grid;gap:6px;font-size:13px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--tide)}
.err{color:var(--papaya);font-size:13px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
nav.tabs .bar{pointer-events:auto;width:100%;max-width:460px;background:var(--white);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:500px){nav.tabs .bar{border-left:3px solid var(--ink);border-right:3px solid var(--ink)}}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--faint);width:56px;position:relative}
.tab.on{color:var(--ink)}
.tab svg{width:22px;height:22px}
.tab .dot{position:absolute;top:-2px;right:12px;min-width:16px;height:16px;border-radius:8px;background:var(--papaya);color:var(--white);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.mic{width:56px;height:56px;border-radius:50%;background:var(--papaya);color:var(--white);display:flex;align-items:center;justify-content:center;margin-top:-30px;border:5px solid var(--white);box-shadow:0 0 0 1px var(--line)}
.mic svg{width:24px;height:24px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 12px;font-size:14px;border-radius:18px;position:relative;word-wrap:break-word}
.msg.them{align-self:flex-start;background:var(--sea);border-bottom-left-radius:5px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--white);border-bottom-right-radius:5px}
.msg .when{display:block;font-size:11px;opacity:.65;margin-top:3px}
.msg .mk{font-size:11px;text-decoration:underline;opacity:.8;margin-left:8px}
.msg.sys{align-self:center;background:var(--iris);font-size:13px;border-radius:14px;max-width:90%}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--white);padding-block:10px 4px;display:grid;gap:4px}
.composer form{display:flex;gap:8px;align-items:center;border:2px solid var(--ink);border-radius:999px;padding:5px 5px 5px 15px}
.composer input{flex:1;border:0;outline:0;min-width:0;background:transparent}
.send{width:36px;height:36px;border-radius:50%;background:var(--papaya);color:var(--white);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.send svg{width:18px;height:18px}

/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day b{width:34px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:var(--ink);background:var(--soft)}
.day.has b{background:var(--lime)}
.day.on b{background:var(--ink);color:var(--white)}
.day .d{width:5px;height:5px;border-radius:50%;background:var(--papaya)}
.wk-item{border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:10px}

/* sheet + overlays */
.scrim{position:fixed;inset:0;background:rgba(16,38,45,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:460px;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92%;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;width:calc(100% - 32px);max-width:428px;background:var(--tide);color:var(--white);border-radius:20px;padding:13px 14px;display:flex;gap:12px;align-items:center}
.toast p{margin:0;font-size:14px;flex:1}
.toast.msg{background:var(--bubble);color:var(--ink);border:2px solid var(--ink);overflow:visible}
.toast.msg .peek{position:absolute;right:18px;top:-24px;transform:rotate(10deg)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .35s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}}
.nudge{position:fixed;inset:0;z-index:50;background:var(--tide);color:var(--white);display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:18px;overflow:hidden}
.nudge .q{font-size:30px;font-weight:600;line-height:1.1;letter-spacing:-.015em;max-width:16ch;position:relative}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
.note-screen{background:var(--tide);color:var(--white);min-height:calc(100vh - 84px);position:relative;overflow:hidden}
.per{border-radius:18px;background:var(--soft);padding:2px 14px 6px}
.per.now{background:var(--white);border:2px solid var(--ink)}
.per-h{display:flex;align-items:center;gap:8px;width:100%;padding:11px 0 8px;text-align:left;min-width:0}
/* TAD docs: The Art Dept brand (Inter, warm paper, black, Tagimocia Red) */
/* Work = Cannibal Isles & Co. Black and white, distressed stamp logo, Oswald headings, Lato text (as on cannibalislesfiji.com) */
.ci{--ink:#000;--soft:#F1F3F4;--sea:#C8D5DC;--iris:#C8D5DC;--line:#E2E2E2;--tide:#000;--muted:#55595e;--papaya:#D7261E;--cio:Oswald,"Arial Narrow",system-ui,sans-serif;font-family:Lato,system-ui,sans-serif;display:grid;gap:14px;align-content:start;background:#fff;margin:-16px -16px -24px;padding:0 16px;min-height:100vh}
.cimk{display:block;background:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ci-top{background:#000;color:#fff;margin:0 -16px;padding:12px 16px 18px;display:grid;gap:14px}
.ci-top .bk{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:20px}
.ci-top .add{background:#fff;color:#000;border-radius:3px;padding:7px 12px;font:600 13px var(--cio);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:4px}
.ci-top .add svg{width:16px;height:16px}
.ci-logo{width:min(250px,64vw);aspect-ratio:480/104}
.ci-kick{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 12px var(--cio);text-transform:uppercase;letter-spacing:.2em}
.ci-kick b{font-weight:700}
.ci .h,.ci .sec-h h2{font-family:var(--cio);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ci .sec-h{border-top:3px solid #000;padding-top:10px;margin-top:6px}
.ci .sec-h h2{font-size:18px}
.ci .pill{border-radius:3px;font:500 11px var(--cio);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px}
.ci .stats{display:flex;gap:8px;flex-wrap:wrap}
.ci .stats .pill{font-size:12px;padding:5px 10px}
.ci .per{border-radius:0;background:#fff;border:2px solid #000;padding:2px 12px 6px}
.ci .per-h .h{font-size:17px}
.ci .ck{border-radius:2px}
.ci .btn{border-radius:3px;font-family:var(--cio);text-transform:uppercase;letter-spacing:.08em}
.ci .link{color:#000;text-decoration:underline;text-underline-offset:3px;font-weight:700}
.ci .empty{border-radius:0;border:1.5px dashed #000;background:#fff;color:#000}
.ci-foot{background:#000;color:#fff;margin:12px -16px 0;padding:22px 16px calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;font:600 15px var(--cio);text-transform:uppercase;letter-spacing:.16em;line-height:1.25}
.ci-foot .cimk{width:46px;aspect-ratio:109/120;flex:0 0 auto}
.ci-ban{background:#000;color:#fff;border-radius:6px;display:flex;gap:12px;align-items:center;padding:12px 14px;text-align:left;width:100%}
.ci-ban .cimk{background:#fff;width:34px;aspect-ratio:109/120;flex:0 0 auto}
.ci-ban .k{display:block;font:500 10.5px Oswald,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.2em;opacity:.75}
.ci-ban .t{font:600 17px Oswald,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.ci-ban .pill{border-radius:3px;font:500 11px Oswald,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em}
.tad{--tr:#CA0013;--tc:#EEEBE3;--tb:#000;font-family:Inter,system-ui,sans-serif;background:var(--tc);color:var(--tb);margin:-16px -16px -24px;padding-bottom:0;min-height:100vh}
.tad .tbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
.tad .abtn{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border:1.5px solid var(--tb);border-radius:999px;padding:5px 11px;white-space:nowrap}
.tad .abtn.c{background:var(--tr);border-color:var(--tr);color:var(--tc)}
.tad .who{font-size:11px;color:rgba(0,0,0,.55);letter-spacing:.02em}
.tad .cover{padding:18px 18px 26px;display:grid;gap:12px}
.tad .kick{font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tad .logo{width:96px;color:var(--tr);justify-self:end}
.tad .logo svg{width:100%;height:auto;display:block}
.tad .big{font-weight:900;font-size:clamp(46px,15vw,68px);line-height:.86;letter-spacing:-.045em;color:var(--tr);text-transform:uppercase;overflow-wrap:anywhere}
.tad .addr{font-weight:800;font-size:22px;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase}
.tad .kick2{font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.tad .tag{background:var(--tr);color:var(--tc);font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:7px 11px;justify-self:start;font-size:14px}
.tad .sec{border-top:2px solid var(--tb);margin:0 18px;padding:16px 0 20px;display:grid;gap:12px}
.tad .sec-top{display:flex;align-items:baseline;gap:10px}
.tad .num{font-size:12px;font-weight:500;flex:0 0 auto}
.tad h2{font-weight:900;font-size:24px;line-height:1;letter-spacing:-.025em;text-transform:uppercase;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.tad .md{font-size:15px;line-height:1.5;display:grid;gap:12px;min-width:0}
.tad .md p{margin:0}
.tad .md strong{font-weight:700}
.tad .md a{color:var(--tr)}
.tad .md ul,.tad .md ol{margin:0;padding-left:20px;display:grid;gap:5px}
.tad .md ul.chk{padding-left:0;list-style:none}
.tad .md ul.chk li{display:flex;gap:9px;align-items:flex-start}
.tad .md .box{width:18px;height:18px;border:2px solid var(--tb);flex:0 0 auto;margin-top:2px;display:flex;align-items:center;justify-content:center;color:var(--tc);font-size:12px;font-weight:900}
.tad .md .box.on{background:var(--tr);border-color:var(--tr)}
.tad .md li.done>span:last-child{text-decoration:line-through;opacity:.55}
.tad .h3{font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.05em;margin-top:4px}
.tad .tw{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
.tad table{border-collapse:collapse;font-size:13px;line-height:1.35;width:100%}
.tad th{text-align:left;font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;border-bottom:2px solid var(--tb);padding:6px 10px 6px 0;vertical-align:bottom}
.tad td{border-bottom:1px solid rgba(0,0,0,.14);padding:7px 10px 7px 0;vertical-align:top;min-width:64px}
.tad tr.tot td{border-top:2px solid var(--tb);border-bottom:0}
.tad .bars{display:grid;gap:10px}
.tad .legend{display:flex;gap:14px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tad .legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.tad .s0{background:var(--tr)} .tad .s1{background:var(--tb)} .tad .s2{background:#F16C19}
.tad .bar-row{display:grid;gap:3px}
.tad .bl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.tad .bt{display:grid;grid-template-columns:1fr 62px;align-items:center;gap:8px}
.tad .track{height:14px}
.tad .track .b{display:block;height:100%}
.tad .bv{font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.tad .tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--tb);display:grid;gap:14px}
.tad .tl li{position:relative}
.tad .tl li::before{content:"";position:absolute;left:-25px;top:3px;width:12px;height:12px;background:var(--tr);border-radius:50%}
.tad .tw-when{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tad .tw-t{font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:-.01em}
.tad .tw-d{font-size:14px}
.tad .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tad .end{background:var(--tr);color:var(--tc);margin-top:8px;padding:28px 18px calc(36px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.tad .end b{font-weight:900;font-size:44px;line-height:.86;letter-spacing:-.04em}
.tad .end .logo{color:var(--tc);width:78px}
.chev{font-size:20px;line-height:1;transition:transform .2s;color:var(--muted)}
.chev.open{transform:rotate(90deg)}
.glass{width:30px;height:34px;border-radius:9px;background:rgba(255,255,255,.6);color:#a9c9c6;display:flex;align-items:center;justify-content:center}
.glass.on{background:var(--tide);color:var(--white)}
.hab{border-radius:999px;padding:7px 13px;font-size:13px;background:rgba(255,255,255,.7)}
.hab.on{background:var(--ink);color:var(--white)}
.bud-row{display:flex;align-items:center;gap:10px;font-size:14px}
.bud-dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.brow{border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}

/* ---------------- skull ---------------- */
function skull(o){
  o=o||{}; const s=o.size||40,dx=o.dx||0,dy=o.dy||0,K="#10262D";
  const sock=c=>`<ellipse cx="${c}" cy="17" rx="4.6" ry="5" fill="#fff" stroke="${K}" stroke-width="2.2"/><circle cx="${c+dx}" cy="${17+dy}" r="2" fill="${K}"/>`;
  const wink=`<path d="M22.5 18 q3.5 -4 7 0" fill="none" stroke="${K}" stroke-width="2.4" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 40 40" width="${s}" height="${s}" aria-hidden="true" style="display:block;${o.style||""}"><path d="M6 18 C6 8 13 3.5 20 3.5 C27 3.5 34 8 34 18 C34 23 31.5 26 28 27 L28 33 C28 35 26.5 36.5 24.5 36.5 L15.5 36.5 C13.5 36.5 12 35 12 33 L12 27 C8.5 26 6 23 6 18 Z" fill="#fff" stroke="${K}" stroke-width="2.4" stroke-linejoin="round"/>${sock(14)}${o.wink?wink:sock(26)}<path d="M20 22.5 l-2 3.6 h4 z" fill="${K}"/><line x1="17" y1="31" x2="17" y2="36" stroke="${K}" stroke-width="1.8"/><line x1="20" y1="31" x2="20" y2="36" stroke="${K}" stroke-width="1.8"/><line x1="23" y1="31" x2="23" y2="36" stroke="${K}" stroke-width="1.8"/></svg>`;

/* ---------------- dates (Fiji time) ---------------- */
function nowFiji(){
  const p={}; new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  return {date:`${p.year}-${p.month}-${p.day}`,mins:Number(p.hour)*60+Number(p.minute)};
}
const toUTC=d=>{const [y,m,dd]=d.split("-").map(Number);return Date.UTC(y,m-1,dd)};
const fromUTC=t=>new Date(t).toISOString().slice(0,10);
const addDays=(d,n)=>fromUTC(toUTC(d)+n*864e5);
const dow=d=>new Date(toUTC(d)).getUTCDay();
const diffDays=(a,b)=>Math.round((toUTC(a)-toUTC(b))/864e5);
const mondayOf=d=>addDays(d,-((dow(d)+6)%7));
const DOWS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOWL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
function niceDate(d,today){
  if(!d) return "";
  const n=diffDays(d,today);
  if(n===0) return "Today"; if(n===1) return "Tomorrow"; if(n===-1) return "Yesterday";
  return `${DOWS[dow(d)]} ${Number(d.slice(8))} ${MON[Number(d.slice(5,7))-1]}`;
}
const toMins=t=>{if(!t) return null;const [h,m]=t.split(":").map(Number);return h*60+m};
function niceTime(t){ if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"pm":"am"; h=h%12||12; return m?`${h}:${String(m).padStart(2,"0")}${ap}`:`${h}${ap}`; }
function ago(iso){
  const t=Date.parse(iso); if(!t) return ""; const s=(Date.now()-t)/1000;
  if(s<60) return "now"; if(s<3600) return Math.floor(s/60)+"m"; if(s<86400) return Math.floor(s/3600)+"h";
  return new Intl.DateTimeFormat("en-GB",{timeZone:TZ,day:"numeric",month:"short"}).format(new Date(t));
}

/* ---------------- state ---------------- */
const S={items:[],chores:[],log:{},messages:[],lists:[],habits:{},bills:[],spend:[],payments:[],bonnie:[],pages:[],pagesec:[],pcomments:[],reviews:[],rcomments:[],loaded:false};
let assets=null,downloads=null;

/* ---------------- chores logic ---------------- */
function choreKey(c,d){
  if(c.until && d>c.until) return null;
  if(c.from && d<c.from) return null;
  switch(c.freq){
    case "daily": return d;
    case "days": return (c.days||[]).includes(dow(d))?d:null;
    case "every": return diffDays(d,c.from||"2026-10-05")%(c.n||3)===0?d:null;
    case "weekly": return "w"+mondayOf(d);
    case "monthly": return "m"+d.slice(0,7);
    case "bimonthly": {const y=d.slice(0,4),m=Number(d.slice(5,7));return "b"+y+"-"+Math.floor((m-1)/2);}
  }
  return null;
}
const dated=c=>["daily","days","every"].includes(c.freq);
const logOf=(c,key)=>S.log[c.id+"__"+key];
function choresFor(d,kind){
  return S.chores.filter(c=>kind==="day"?dated(c):kind==="week"?c.freq==="weekly":["monthly","bimonthly"].includes(c.freq))
    .map(c=>({c,key:choreKey(c,d)})).filter(x=>x.key)
    .sort((a,b)=>(a.c.time||"99").localeCompare(b.c.time||"99")||(a.c.order||0)-(b.c.order||0));
}

/* ---------------- writes ---------------- */
function toast(text,opts){
  opts=opts||{};
  const L=document.getElementById("layer");
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status");
  el.innerHTML=(opts.skull?`<div style="flex:0 0 auto">${skull({size:34,dx:-1.5,dy:-1})}</div>`:"")+`<p>${esc(text)}</p><button class="btn sm" style="background:var(--white);color:var(--ink)" data-act="toast-x">${opts.btn||"OK"}</button>`;
  L.querySelectorAll(".toast").forEach(t=>t.remove());
  L.appendChild(el);
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.remove(),opts.ms||6000);
}
async function guard(fn){
  if(!db){toast("Still connecting. Try again in a moment.");return false}
  if(!canWrite){toast("This view is read-only. Nakita can add you as an editor from the Share menu.");return false}
  try{await fn();return true}
  catch(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;toast("This view is read-only. Nakita can add you as an editor from the Share menu.")}
    else if(e&&e.code==="quota_exceeded"){toast("Storage is full. Clear some done items in Lists.")}
    else toast("That didn't save. Check your connection and try again.");
    return false;
  }
}
const isoNow=()=>new Date().toISOString();
async function toggleItem(id){
  const it=S.items.find(x=>x.id===id); if(!it) return;
  const done=!it.done;
  Object.assign(it,{done,doneBy:done?me:"",doneAt:done?isoNow():""}); render();
  if(done) didToast("item",id,"",me);
  await guard(()=>db.doc("items/"+id).update({done,doneBy:done?me:"",doneAt:done?isoNow():""}));
}
async function toggleChore(cid,key){
  const id=cid+"__"+key, has=S.log[id];
  if(has) delete S.log[id]; else S.log[id]={by:me,at:isoNow()}; render();
  if(!has) didToast("chore",cid,key,me);
  await guard(()=>has?db.doc("chorelog/"+id).delete():db.doc("chorelog/"+id).set({chore:cid,key,by:me,at:isoNow()}));
}
/* who actually did a job: nakita, colin or both */
const whoDid=k=>k==="both"?"both of you":nm(k);
const WhoDid=k=>k==="both"?"Both of you":nm(k);
function didToast(kind,id,key,cur,pick){
  const L=document.getElementById("layer"); L.querySelectorAll(".toast").forEach(t=>t.remove());
  const opts=["nakita","colin","both"].filter(v=>pick||v!==cur);
  const lbl=v=>v==="both"?"Both of us":v===me?"Me":nm(v)+" did it";
  const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status");
  el.innerHTML=`<p>${pick?"Who did it?":cur===me?"Ticked off as done by you.":"Done by "+whoDid(cur)+"."}</p><div class="row" style="gap:6px;flex-wrap:wrap;justify-content:flex-end">${opts.map(v=>`<button class="btn sm" style="background:${v===cur?"var(--ink)":"var(--white)"};color:${v===cur?"var(--white)":"var(--ink)"}" data-act="did-who" data-kind="${kind}" data-id="${id}" data-key="${key||""}" data-v="${v}">${lbl(v)}</button>`).join("")}</div>`;
  L.appendChild(el); clearTimeout(toast._t); toast._t=setTimeout(()=>el.remove(),pick?12000:7000);
}
async function setDidBy(kind,id,key,v){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  if(kind==="item"){const it=S.items.find(x=>x.id===id); if(!it||!it.done) return; it.doneBy=v; render(); if(await guard(()=>db.doc("items/"+id).update({doneBy:v}))) toast(`Got it: done by ${whoDid(v)}.`)}
  else {const lid=id+"__"+key, lg=S.log[lid]; if(!lg) return; lg.by=v; render(); if(await guard(()=>db.doc("chorelog/"+lid).update({by:v}))) toast(`Got it: done by ${whoDid(v)}.`)}
}
async function sendMessage(text,extra){
  text=(text||"").trim(); if(!text) return false;
  const m=Object.assign({from:me,text,at:isoNow()},extra||{});
  const ok=await guard(()=>db.collection("messages").add(m));
  if(ok&&window.hbNotify) hbNotify({text,kind:(extra&&extra.kind)||"message"});
  return ok;
}

/* ---------------- calendar (Google Calendar connector) ---------------- */
function calMsg(code){
  if(code==="server_not_connected"||code==="selection_required") return "Add Google Calendar in Claude Settings → Connectors";
  if(code==="needs_reauth") return "Reconnect Google Calendar in Claude Settings → Connectors";
  if(code==="not_in_manifest") return "Calendar is switched off for this app";
  if(code==="blocked_by_policy"||code==="approval_required") return "Calendar isn't allowed here";

}
async function loadCalendar(force){
  if(!mcp) return;
  const t=nowFiji().date;
  cal.state="loading"; render();
  try{
    const r=await mcp.callTool("Google Calendar","list_events",{startTime:`${t}T00:00:00+12:00`,endTime:`${addDays(t,1)}T00:00:00+12:00`,orderBy:"startTime",pageSize:25,timeZone:TZ},{cache:force?{refresh:true}:{staleTime:60000}});
    const p=r&&r.payload; const evs=(p&&Array.isArray(p.events))?p.events:[];
    cal={state:"ok",events:evs.filter(e=>e.status!=="cancelled").map(e=>({title:e.summary||"Untitled",start:(e.start&&(e.start.dateTime||e.start.date))||"",allDay:!!(e.start&&e.start.date&&!e.start.dateTime)})),msg:""};
  }catch(e){
    if(e&&e.retryable&&!force){setTimeout(()=>loadCalendar(true),(e.retryAfterMs||2500)+Math.random()*1500)}
    cal={state:"err",events:[],msg:calMsg(e&&e.code)};
  }
  render();
}
let weekCal={start:null,state:"idle",byDay:{},msg:""};
async function loadWeekCal(start,force){
  if(!mcp) return;
  if(weekCal.start===start&&weekCal.state==="ok"&&!force) return;
  weekCal={start,state:"loading",byDay:{},msg:""}; render();
  try{
    const r=await mcp.callTool("Google Calendar","list_events",{startTime:`${start}T00:00:00+12:00`,endTime:`${addDays(start,7)}T00:00:00+12:00`,orderBy:"startTime",pageSize:150,timeZone:TZ},{cache:{staleTime:120000}});
    const evs=(r&&r.payload&&Array.isArray(r.payload.events))?r.payload.events:[];
    const by={};
    evs.filter(e=>e.status!=="cancelled").forEach(e=>{const st=(e.start&&(e.start.dateTime||e.start.date))||"";const d=st.slice(0,10);if(!d) return;(by[d]=by[d]||[]).push({title:e.summary||"Untitled",time:e.start.dateTime?st.slice(11,16):"",allDay:!e.start.dateTime})});
    if(weekCal.start===start) weekCal={start,state:"ok",byDay:by,msg:""};
  }catch(e){ if(weekCal.start===start) weekCal={start,state:"err",byDay:{},msg:calMsg(e&&e.code)}; }
  render();
}
async function addReminder(it){
  if(!mcp) return {ok:false,msg:"Calendar reminders need the Google Calendar connector."};
  const time=it.time||"09:00", start=`${it.due}T${time}:00+12:00`;

const CUR={FJD:"FJ$",USD:"US$",AUD:"AU$"};

function toFJ(a,c){const v=Number(a)||0;if(!c||c==="FJD")return v;const r=Number(RATES[c])||0;return v*r*(1+(Number(RATES.fee)||0)/100)}
function fjSum(list,fn){let t=0,any=false;list.forEach(x=>{const v=fn(x);if(v){t+=toFJ(v,x.cur);any=true}});return any?money(Math.round(t*100)/100,"FJD"):"—"}

const FREQ={weekly:"Weekly",fortnightly:"Fortnightly",monthly:"Monthly",quarterly:"Every 3 months",yearly:"Yearly",once:"One-off"};
const GROUPS={living:{label:"Life and living",bg:"var(--lime)"},work:{label:"Work and subscriptions",bg:"var(--sea)"}};
function money(n,c){if(n==null||n==="")return "—";const v=Number(n);return (CUR[c]||"$")+v.toLocaleString("en-US",{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})}
function addMonths(d,n){const [y,m,dd]=d.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(dd,last));return t.toISOString().slice(0,10)}
function nextDueAfter(b){const d=b.nextDue;if(!d)return "";return b.freq==="weekly"?addDays(d,7):b.freq==="fortnightly"?addDays(d,14):b.freq==="monthly"?addMonths(d,1):b.freq==="quarterly"?addMonths(d,3):b.freq==="yearly"?addMonths(d,12):""}
const perMonth=b=>{const a=Number(b.amount)||0;return b.freq==="weekly"?a*52/12:b.freq==="fortnightly"?a*26/12:b.freq==="monthly"?a:b.freq==="quarterly"?a/3:b.freq==="yearly"?a/12:0};
function sumByCurOld(list,fn){const t={};list.forEach(x=>{const v=fn(x);if(v){t[x.cur||"FJD"]=(t[x.cur||"FJD"]||0)+v}});const k=Object.keys(t);return k.length?k.map(c=>money(Math.round(t[c]*100)/100,c)).join(" + "):"—"}
function billStatus(b,today){

async function saveBill(){

const hourLabel=h=>{const x=h%12||12;return `${x}${h<12?"am":"pm"}`};
function laundryAdvice(w,today,nowM){
  const H=w.hourly; const idx=H.time.indexOf(`${today}T${String(Math.floor(nowM/60)).padStart(2,"0")}:00`);
  if(idx<0) return null;
  const at=i=>({h:Number(H.time[i].slice(11,13)),d:H.time[i].slice(0,10),p:H.precipitation_probability[i]??0,mm:H.precipitation[i]??0,c:H.cloud_cover[i]??0,day:H.is_day[i]===1});
  const wet=x=>x.p>=55||x.mm>=0.3, dry=x=>x.p<40&&x.mm<0.2;
  const hourNow=Math.floor(nowM/60);
  if(hourNow>=17||hourNow<6){
    const tm=[];for(let i=idx;i<H.time.length;i++){const x=at(i);if(x.d!==today&&x.h>=7&&x.h<=15) tm.push(x)}
    if(!tm.length) return null;
    const dryAm=tm.filter(x=>x.h<12).every(dry), sunAm=tm.filter(x=>x.h<12).filter(x=>x.c<50).length>=3;
    const firstWet=tm.find(wet);
    if(dryAm&&sunAm) return {tone:"sun",text:`Tomorrow morning looks dry and sunny. Plan a load first thing, even sheets and towels.${firstWet?` Showers from about ${hourLabel(firstWet.h)}.`:""}`};
    if(firstWet&&firstWet.h<=9) return {tone:"rain",text:"Showers tomorrow morning. Wash later, or use the covered line."};
    return {tone:"ok",text:firstWet?`Tomorrow: dry until about ${hourLabel(firstWet.h)}. Wash early.`:"Tomorrow looks dry. A good washing day."};
  }
  const next=[];for(let i=idx;i<Math.min(idx+10,H.time.length);i++){const x=at(i);if(x.d===today&&x.h<18) next.push(x)}
  const soon=next.slice(1,4).find(wet);
  if(soon&&!wet(next[0])) return {tone:"rain",text:`Rain likely around ${hourLabel(soon.h)} (${soon.p}%). If the washing's out, bring it in!`};
  if(wet(next[0])){const clear=next.findIndex((x,i)=>i>0&&dry(x)&&next.slice(i,i+3).every(dry));return {tone:"rain",text:clear>0?`Wet now, drying out from about ${hourLabel(next[clear].h)}. Put a load on then.`:"Wet for the rest of the day. Dryer or covered line today."}}
  let run=0;for(const x of next){if(dry(x)) run++; else break}
  const sunny=next.slice(0,run).filter(x=>x.c<50).length;
  const until=run<next.length?` until about ${hourLabel(next[run].h)}`:" for the rest of the day";
  if(run>=4&&sunny>=2) return {tone:"sun",text:`Dry and sunny${until}. Great time for a load, even sheets and towels.`};
  if(run>=3) return {tone:"ok",text:sunny?`Mostly dry${until}. Good for a load.`:`Dry but cloudy${until}. Fine for a load, but it'll dry slowly, so skip the sheets.`};
  const later=next.findIndex((x,i)=>i>0&&dry(x)&&x.c<50&&next.slice(i,i+3).every(dry));
  if(later>0) return {tone:"ok",text:`Sun's due from about ${hourLabel(next[later].h)}. Put a load on now so it's ready to hang.`};
  return {tone:"rain",text:"Showery day. Dryer or covered line today."};
}

  return `<header style="position:relative"><h1 class="h" style="font-size:26px;margin:0;display:inline-block;position:relative">Lists<span style="position:absolute;left:100%;top:-8px;margin-left:4px;transform:rotate(18deg)">${skull({size:28,wink:1,dx:-1.5})}</span></h1></header>
  <div class="chips">${tab("shopping","Shopping")}${tab("recipes","Snacks + meals")}${tab("specials","Specials")}${tab("saved","Saved")}</div>${body}`;
}
function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:var(--tide)">$1</a>')}

function renderWeek(){
  const today=nowFiji().date;
  if(!weekStart) weekStart=mondayOf(today);
  if(!weekSel) weekSel=today;
  const days=[...Array(7)].map((_,i)=>addDays(weekStart,i));
  const itemsOn=d=>S.items.filter(i=>i.due===d);
  const sel=weekSel, its=itemsOn(sel).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const ch=choresFor(sel,"day");
  const ttl=`${MONL[Number(weekStart.slice(5,7))-1]} ${Number(weekStart.slice(8))} – ${Number(days[6].slice(8))}`;
  return `<header class="row" style="justify-content:space-between"><h1 class="h" style="font-size:26px;margin:0">This week</h1><div class="row" style="gap:6px"><button class="chip" data-act="wk" data-v="-7" aria-label="Previous week">‹</button><button class="chip" data-act="wk" data-v="0">Today</button><button class="chip" data-act="wk" data-v="7" aria-label="Next week">›</button></div></header>
  <div class="lb">${ttl}</div>
  <div class="days">${days.map(d=>{const n=itemsOn(d).filter(i=>!i.done);return `<button class="day ${n.length?"has":""} ${d===sel?"on":""}" data-act="wk-day" data-v="${d}" aria-label="${DOWL[dow(d)]} ${Number(d.slice(8))}">${DOWS[dow(d)].slice(0,1)}<b>${Number(d.slice(8))}</b>${n.some(i=>i.due<today||i.cat==="home"&&/rent/i.test(i.title))?'<span class="d"></span>':'<span style="height:5px"></span>'}</button>`}).join("")}</div>
  <div class="sec-h"><h2>${DOWL[dow(sel)]} ${Number(sel.slice(8))}</h2><button class="link" data-act="item-new" data-due="${sel}">Add</button></div>
  ${its.length?its.map(i=>`<div class="wk-item" style="background:${i.done?"var(--soft)":CATS[i.cat].bg}"><button class="ck ${i.done?"on":""}" data-act="item-tick" data-id="${i.id}" aria-label="Toggle ${esc(i.title)}">${i.done?ICON.check:""}</button><button style="flex:1;text-align:left;min-width:0" data-act="item-edit" data-id="${i.id}"><div class="nw" style="${i.done?"text-decoration:line-through;color:var(--faint)":""}">${esc(i.title)}</div><div class="lb" style="color:var(--ink);opacity:.7">${i.time?niceTime(i.time)+" · ":""}${i.who==="either"?"Either":nm(i.who)}</div></button></div>`).join(""):emptyState("No to-dos on this day.")}
  ${(()=>{if(!mcp) return ""; if(weekCal.start!==weekStart){setTimeout(()=>loadWeekCal(weekStart),0);return ""}
    if(weekCal.state==="loading") return `<div class="lb">Loading your calendar…</div>`;
    if(weekCal.state==="err") return `<button class="lb" data-act="wk-cal-retry" style="white-space:normal;text-align:left">${esc(weekCal.msg)}. Tap to try again.</button>`;
    const evs=(weekCal.byDay[sel]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    if(!evs.length) return "";
    const open=!!periodOpen["cal-"+sel];
    return `<section class="per"><button class="per-h" data-act="period" data-p="cal-${sel}" aria-expanded="${open}"><span class="h" style="font-size:15px">On the calendar</span><span class="lb">${evs.length}</span><span class="lb nw" style="margin-left:auto">${esc(evs[0].allDay?evs[0].title:niceTime(evs[0].time)+" "+evs[0].title)}</span><span class="chev ${open?"open":""}">›</span></button>${open?`<div class="list">${evs.map(e=>`<div class="it"><span class="lb" style="width:52px;flex:0 0 auto">${e.allDay?"All day":niceTime(e.time)}</span><div class="body"><div class="tt nw">${esc(e.title)}</div></div></div>`).join("")}</div>`:""}</section>`;})()}
  ${ch.length?`<div class="sec-h"><h2 style="font-size:15px">Chores that day</h2><span class="lb">${ch.filter(x=>logOf(x.c,x.key)).length} of ${ch.length}</span></div><div class="list">${ch.map(x=>choreRow(x,today,sel===today?nowFiji().mins:(sel<today?1440:0))).join("")}</div>`:""}`;
}

let noteDraft="",noteRes=null,noteBusy=false,noteErr="";
function renderNote(){
  return `<div class="note-screen" style="margin:-16px -16px -24px;padding:22px 16px 30px">
   <div class="blob" style="width:150px;height:150px;background:var(--bubble);right:-46px;top:-40px"></div>
   <div style="position:absolute;right:30px;top:30px;transform:rotate(-14deg)">${skull({size:50,dx:-2,dy:1.5})}</div>
   <div style="position:relative;display:grid;gap:14px">
    <div><div style="font-size:12px;opacity:.85">Quick note</div><div class="h" style="font-size:26px;line-height:1.1">Say it,<br>Claude sorts it</div></div>
    ${window.hbRecorder&&hbRecorder.supported?`<button class="recbtn ${recState}" data-act="rec" ${recState==="busy"?"disabled":""}>${recState==="rec"?STOP:ICON.mic}<span>${recState==="rec"?"Listening… tap to stop":recState==="busy"?"Writing it down…":"Tap to talk"}</span></button>`:""}
    <div style="font-size:12px;opacity:.85">Or type it in the box.</div>
    <textarea class="input" id="noteIn" style="border-color:var(--white)" placeholder="Need eggs and dog biscuits, remind Colin to call Kokomo Monday, curry on Tuesday…" aria-label="Your note">${esc(noteDraft)}</textarea>

    ${noteErr?`<div style="background:var(--white);color:var(--papaya);border-radius:12px;padding:10px;font-size:13px;display:grid;gap:8px"><span>${esc(noteErr)}</span>${noteDraft&&!noteRes?`<div class="two"><button class="btn ink sm" data-act="note-todo">Save as a to-do</button><button class="btn line sm" style="color:var(--ink)" data-act="note-plain">Save as a note</button></div>`:""}</div>`:""}
    ${noteRes?`<div style="display:grid;gap:8px">${noteRes.map((r,i)=>`<label class="res" style="background:${r.type==="shopping"?"var(--bubble)":r.type==="message"?"var(--iris)":r.type==="saved"?"var(--sea)":CATS[r.cat]?CATS[r.cat].bg:"var(--lime)"}"><input type="checkbox" id="nr-${i}" ${r.keep!==false?"checked":""} data-act="note-keep" data-i="${i}" style="width:20px;height:20px;accent-color:var(--ink)"><span style="flex:1;min-width:0"><span class="nw" style="display:block">${esc(r.title)}</span><span style="font-size:12px;opacity:.75">${r.type==="todo"?`To-do · ${r.who==="either"?"either of us":nm(r.who)}${r.due?" · "+niceDate(r.due,nowFiji().date):""}${r.time?" "+niceTime(r.time):""}${r.remind?" · reminder":""}`:r.type==="shopping"?"Shopping":r.type==="message"?`Message to ${nm(other())}`:"Saved note"}</span></span></label>`).join("")}</div>
      <div class="two"><button class="btn line" style="border-color:var(--white)" data-act="note-clear">Start over</button><button class="btn pap" data-act="note-save">Save all</button></div>`
    :`<button class="btn pap" data-act="note-sort" ${noteBusy?"disabled":""}>${noteBusy?"Sorting…":"Sort it"}</button>
      <button class="btn line" style="border-color:var(--white)" data-act="note-plain">Just save it as a note</button>`}
   </div></div>`;
}

const ciMask=u=>`-webkit-mask-image:url(${u});mask-image:url(${u})`;
function workBanner(today){
  const w=S.items.filter(i=>!i.done&&i.cat==="work"&&(i.who===me||i.who==="either"||!i.who));
  const dueToday=w.filter(i=>i.due===today).length, overdue=w.filter(i=>i.due&&i.due<today).length;
  const toReview=S.reviews.filter(r=>r.status==="review"&&r.to===me).length;
  const toSend=S.reviews.filter(r=>r.from===me&&(r.status==="approved"||r.status==="changes")).length;
  const next=w.filter(i=>i.due).sort((a,b)=>(a.due+(a.time||"99")).localeCompare(b.due+(b.time||"99")))[0];
  const bits=[dueToday?dueToday+" due today":"",overdue?overdue+" overdue":"",toReview?toReview+" to review":"",toSend?toSend+" back from "+nm(other()):""].filter(Boolean);
  return `<button class="ci-ban" data-act="go" data-to="work" aria-label="Work, Cannibal Isles and Co.">
   <span class="cimk" style="${ciMask(CI_SKULL)}"></span>
   <span style="flex:1;min-width:0"><span class="k">Cannibal Isles &amp; Co.</span><span class="row" style="gap:8px"><span class="t">Work</span>${overdue?`<span class="pill p-late">${overdue} overdue</span>`:""}${toReview?`<span class="pill" style="background:#C8D5DC;color:#000">${toReview} to review</span>`:""}</span>
   <span class="nw" style="display:block;font-size:13px;opacity:.85;margin-top:2px">${bits.length?bits.filter(b=>!/overdue|to review/.test(b)).join(" · ")||"Tap to see it all":"All clear"}${next?" · Next: "+esc(next.title):""}</span></span>
   <span class="chev" style="color:#fff">›</span></button>`;
}
function renderWork(){
  const today=nowFiji().date;
  const items=S.items.filter(i=>i.cat==="work");
  const open=items.filter(i=>!i.done), done=items.filter(i=>i.done).sort((a,b)=>(b.doneAt||"").localeCompare(a.doneAt||""));
  const ord=i=>(i.due||"9999")+(i.time||"99");
  const groups={}; open.forEach(i=>{(groups[projectOf(i)]=groups[projectOf(i)]||[]).push(i)});
  const names=Object.keys(groups).sort((a,b)=>a==="Other"?1:b==="Other"?-1:ord(groups[a].sort((x,y)=>ord(x).localeCompare(ord(y)))[0]).localeCompare(ord(groups[b].sort((x,y)=>ord(x).localeCompare(ord(y)))[0])));
  const revs=S.reviews.filter(r=>r.status!=="sent").sort((a,b)=>(b.updatedAt||b.at||"").localeCompare(a.updatedAt||a.at||""));
  const sentRevs=S.reviews.filter(r=>r.status==="sent").length;
  const pages=S.pages.slice().sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||""));
  const overdue=open.filter(i=>i.due&&i.due<today).length, dueToday=open.filter(i=>i.due===today).length, week=open.filter(i=>i.due&&i.due>today&&i.due<=addDays(today,7)).length;
  return `<div class="ci"><header class="ci-top">
   <div class="row" style="justify-content:space-between"><button data-act="go" data-to="home" aria-label="Back" class="bk">‹</button><button class="add" data-act="work-new">${ICON.plus}To-do</button></div>
   <h1 style="margin:0"><span class="cimk ci-logo" role="img" aria-label="Cannibal Isles" style="${ciMask(CI_LOGO)}"></span></h1>
   <div class="ci-kick"><span><b>&amp; Co.</b> · Work</span><span>${DOWS[dow(today)]} ${Number(today.slice(8))} ${MONL[Number(today.slice(5,7))-1].slice(0,3)}</span></div></header>
  <div class="stats">${overdue?`<span class="pill p-late">${overdue} overdue</span>`:""}<span class="pill" style="background:#000;color:#fff">${dueToday} today</span><span class="pill" style="background:var(--sea)">${week} this week</span></div>

  <div class="sec-h"><h2>For review</h2><button class="link" data-act="rev-new">Send something to ${nm(other())}</button></div>
  ${revs.length?`<div class="list">${revs.map(r=>`<button class="it" style="text-align:left" data-act="rev-open" data-id="${r.id}"><div class="body"><div class="tt nw">${esc(r.title)}</div><div class="meta">${revPill(r)}<span class="lb">${esc(r.project||"")}${r.project?" · ":""}from ${nm(r.from)} · ${ago(r.updatedAt||r.at)}</span></div></div><span class="chev">›</span></button>`).join("")}</div>`:`<div class="empty" style="font-size:13px">Drafts, proposals and emails you want ${nm(other())} to check before they go out.</div>`}
  ${sentRevs?`<div class="lb">${sentRevs} sent and filed away</div>`:""}

  <div class="sec-h"><h2>To-dos by client</h2><span class="lb">${open.length} open</span></div>
  ${names.length?names.map(n=>{const its=groups[n].sort((a,b)=>ord(a).localeCompare(ord(b)));const isOpen=(n in workOpen)?workOpen[n]:its.some(i=>i.due&&i.due<=addDays(today,2));const late=its.filter(i=>i.due&&i.due<today).length;
    return `<section class="per"><button class="per-h" data-act="work-proj" data-p="${esc(n)}" aria-expanded="${isOpen}"><span class="h" style="font-size:16px">${esc(n)}</span><span class="lb">${its.length}</span>${late?`<span class="pill p-late">${late} late</span>`:""}<span class="lb nw" style="margin-left:auto;max-width:45%">${its[0].due?niceDate(its[0].due,today):""}</span><span class="chev ${isOpen?"open":""}">›</span></button>${isOpen?`<div class="list">${its.map(i=>itemRow(i,today)).join("")}</div>`:""}</section>`}).join(""):emptyState(S.loaded?"No work to-dos. Enjoy it.":"Loading…")}
  ${done.length?`<button class="link" data-act="work-done" style="justify-self:start">${workShowDone?"Hide":"Show"} ${done.length} done</button>${workShowDone?`<div class="list">${done.slice(0,40).map(i=>itemRow(i,today)).join("")}</div>`:""}`:""}

  <div class="sec-h"><h2>Docs</h2><button class="link" data-act="doc-new">New doc</button></div>
  ${pages.length?`<div class="list">${pages.map(p=>{const oc=docComments(p.id).filter(c=>!c.resolved).length;return `<button class="it" style="text-align:left" data-act="doc-open" data-id="${p.id}"><span style="width:34px;height:34px;flex:0 0 auto;background:#CA0013;color:#EEEBE3;display:flex;align-items:center;justify-content:center;font:900 11px Inter,sans-serif">TAD</span><div class="body"><div class="tt nw" style="font-weight:600">${esc(p.title)}${p.sub?" · "+esc(p.sub):""}</div><div class="meta"><span class="lb">${esc(p.kicker||"")}</span>${oc?`<span class="pill" style="background:var(--iris)">${plural(oc,"open comment")}</span>`:""}</div></div><span class="chev">›</span></button>`}).join("")}</div>`:emptyState("No docs yet.")}
  <footer class="ci-foot"><span>Cannibal Isles<br>&amp; Co.</span><span class="cimk" style="${ciMask(CI_SKULL)}"></span></footer></div>`;
}
/* reviews: send a draft to the other person, they approve it or ask for changes */
function openRevNew(id){
  const r=id?S.reviews.find(x=>x.id===id):null;
  revEdit={id:r?r.id:null,title:r?r.title:"",project:r?r.project:"",body:r?r.body:"",link:r?r.link:""};
  drawRevSheet("");
}
function drawRevSheet(err){
  closeSheet(); const e=revEdit;
  const chip=v=>`<button type="button" class="${e.project===v?"on":""}" data-act="rev-proj" data-v="${esc(v)}">${esc(v)}</button>`;
  openSheet(`<form id="revForm" style="display:grid;gap:12px" autocomplete="off">
   <div class="row" style="justify-content:space-between"><h2 class="h" style="font-size:20px;margin:0">${e.id?"Edit and resend":"Send to "+nm(other())+" to review"}</h2><button type="button" class="lb" data-act="sheet-x" style="color:var(--ink);font-size:14px">Close</button></div>
   <label class="f">What is it<input class="input" id="rv-title" value="${esc(e.title)}" placeholder="Email to Julie about the invoice" required></label>
   <div class="f" style="display:grid;gap:6px;font-size:13px;font-weight:500">Client<div class="seg">${workProjects().map(chip).join("")}</div></div>

function mdInline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdCells(line){let t=line.trim();if(t.startsWith("|"))t=t.slice(1);if(t.endsWith("|"))t=t.slice(0,-1);return t.split("|").map(c=>c.trim())}

  const isTot=cs=>cs.some(c=>c)&&cs.every(c=>!c||/^\*\*.*\*\*$/.test(c));
  return `<div class="tw"><table><thead><tr>${head.map(c=>`<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${body.map(cs=>`<tr${isTot(cs)?' class="tot"':""}>${head.map((_,i)=>`<td>${mdInline(cs[i]||"")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function mdBars(lines){

  const series=rows[0], data=rows.slice(1).map(r=>({l:r[0],v:r.slice(1).map(x=>Number(String(x).replace(/[^0-9.\-]/g,""))||0)}));
  const max=Math.max(1,...data.flatMap(d=>d.v));
  return `<div class="bars"><div class="legend">${series.map((s,i)=>`<span><i class="s${i%3}"></i>${esc(s)}</span>`).join("")}</div>${data.map(d=>`<div class="bar-row"><div class="bl">${esc(d.l)}</div>${d.v.map((v,i)=>`<div class="bt"><div class="track"><span class="b s${i%3}" style="width:${Math.max(.5,Math.abs(v)/max*100).toFixed(1)}%"></span></div><span class="bv">${v.toLocaleString("en")}</span></div>`).join("")}</div>`).join("")}</div>`;
}
function mdTimeline(lines){
  return `<ol class="tl">${lines.map(mdCells).filter(r=>r[0]).map(r=>`<li><div class="tw-when">${mdInline(r[0])}</div><div class="tw-t">${mdInline(r[1]||"")}</div>${r[2]?`<div class="tw-d">${mdInline(r[2])}</div>`:""}</li>`).join("")}</ol>`;

function mdToHtml(src,secId){
  const L=String(src||"").replace(/\r/g,"").split("\n");let out="",i=0,box=0;
  const blockRe=/^(```|\s*\||#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s)/;
  while(i<L.length){
    const line=L[i];
    if(!line.trim()){i++;continue}
    const fence=line.match(/^```\s*(\w*)/);
    if(fence){const kind=fence[1],body=[];i++;while(i<L.length&&!/^```/.test(L[i])){if(L[i].trim())body.push(L[i]);i++}i++;out+=kind==="bars"?mdBars(body):kind==="timeline"?mdTimeline(body):`<p style="white-space:pre-wrap">${esc(body.join("\n"))}</p>`;continue}
    if(/^\s*\|/.test(line)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}out+=mdTable(rows);continue}
    if(/^#{1,4}\s/.test(line)){out+=`<div class="h3">${mdInline(line.replace(/^#+\s*/,""))}</div>`;i++;continue}
    if(/^\s*[-*]\s/.test(line)){
      const its=[];while(i<L.length&&/^\s*[-*]\s/.test(L[i])){its.push(L[i].replace(/^\s*[-*]\s/,""));i++}
      const anyChk=its.some(t=>/^\[[ xX]\]/.test(t));
      out+=`<ul${anyChk?' class="chk"':""}>${its.map(t=>{
        const m=t.match(/^\[([ xX])\]\s?/);
        if(!m) return `<li>${anyChk?"<span>–</span> ":""}<span>${mdInline(t)}</span></li>`;
        const on=m[1]!==" ",n=box++;
        return `<li class="${on?"done":""}"><button class="box ${on?"on":""}" ${secId?`data-act="ds-tick" data-id="${secId}" data-n="${n}"`:""} aria-label="${on?"Untick":"Tick"}">${on?"✓":""}</button><span>${mdInline(t.slice(m[0].length))}</span></li>`;
      }).join("")}</ul>`;continue}
    if(/^\s*\d+[.)]\s/.test(line)){const its=[];while(i<L.length&&/^\s*\d+[.)]\s/.test(L[i])){its.push(L[i].replace(/^\s*\d+[.)]\s/,""));i++}out+=`<ol>${its.map(t=>`<li>${mdInline(t)}</li>`).join("")}</ol>`;continue}
    const para=[L[i++]];while(i<L.length&&L[i].trim()&&!blockRe.test(L[i])){para.push(L[i]);i++}
    out+=`<p>${mdInline(para.join(" "))}</p>`;
  }
  return out;
}

function touchDoc(){guard(()=>db.doc("pages/"+docId).update({updatedAt:isoNow(),updatedBy:me}))}
async function saveDocSec(force){
  dsEdit.h=document.getElementById("ds-h").value.trim(); dsEdit.md=document.getElementById("ds-md").value.replace(/\s+$/,"");
  if(!dsEdit.h){drawDocSecSheet("Give the section a heading.");return}
  const cur=dsEdit.id&&S.pagesec.find(x=>x.id===dsEdit.id);
  if(!force&&cur&&(cur.updatedAt||"")!==dsEdit.base&&cur.updatedBy!==me){drawDocSecSheet(`${nm(cur.updatedBy)} changed this section while you were editing. Saving now replaces their changes.`,true);return}
  const data={h:dsEdit.h,md:dsEdit.md,updatedBy:me,updatedAt:isoNow()};
  let ok;
  if(dsEdit.id){ok=await guard(()=>db.doc("pagesec/"+dsEdit.id).update(data));if(ok&&cur)Object.assign(cur,data)}
  else{const secs=docSecs(docId),order=(secs.length?Math.max(...secs.map(s=>s.order||0)):0)+1;ok=await guard(()=>db.collection("pagesec").add(Object.assign(data,{page:docId,order})))}
  if(ok){closeSheet();touchDoc();render();toast(`Saved. ${nm(other())} sees it straight away.`)}
}

function render(){
  if(!me){renderWho();return}
  const v=document.getElementById("view");
  const keepFocus=document.activeElement&&document.activeElement.id;
  const val=keepFocus&&document.activeElement.value;
  if(route==="note"){const el=document.getElementById("noteIn");if(el) noteDraft=el.value}
  v.innerHTML=route==="plan"||route==="todos"||route==="week"?renderPlan():route==="bonnie"?renderBonnie():route==="bills"?renderBills():route==="chat"?renderChat():route==="lists"?renderLists():route==="week"?renderWeek():route==="todos"?renderTodos():route==="note"?renderNote():route==="docs"?renderDocs():route==="doc"?renderDoc():route==="work"?renderWork():renderHome();
  renderTabs();
  document.getElementById("app").style.background=route==="note"?"var(--tide)":route==="doc"?"#EEEBE3":"";
  if(route==="doc") store.set("docSeen",isoNow());
  if(keepFocus){const el=document.getElementById(keepFocus);if(el&&el.tagName!=="BUTTON"){el.focus();if(val!=null&&el.value!==val)el.value=val}}
  if(route==="chat"){store.set("chatSeen",isoNow());const m=document.getElementById("msgs");if(m&&!render._chatScrolled){window.scrollTo(0,document.body.scrollHeight);render._chatScrolled=true}}
  else render._chatScrolled=false;
}

let recState="idle";
const STOP='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"/></svg>';
async function recStart(){
  if(recState!=="idle") return;
  const el=document.getElementById("noteIn"); if(el) noteDraft=el.value;
  recState="rec"; noteErr=""; noteRes=null; render();
  try{await hbRecorder.start()}
  catch(e){recState="idle";noteErr="Home Base needs the microphone. Tap Allow when your phone asks, or turn it on in Settings → Safari → Microphone.";render()}
}
async function recStop(){
  if(recState!=="rec") return;
  recState="busy"; render();
  try{
    const blob=await hbRecorder.stop();
    const text=blob&&blob.size?await hbTranscribe(blob):"";
    recState="idle";
    if(!text){noteErr="I didn't catch anything. Try again a little closer to the phone.";render();return}
    noteDraft=(noteDraft?noteDraft.trim()+" ":"")+text; render(); sortNote();
  }catch(e){recState="idle";noteErr="That didn't go through. Check your connection and try again, or type it.";render()}
}
window.addEventListener("hb-refresh",()=>render());
window.addEventListener("hb-rec-timeout",()=>recStop());

async function sortNote(){
  const el=document.getElementById("noteIn"); noteDraft=el?el.value.trim():noteDraft;
  if(!noteDraft){noteErr="Say or type something first.";render();return}
  if(!sample){noteErr="Claude isn't available in this view. You can still save it as a note.";render();return}
  noteBusy=true;noteErr="";render();
  const {date}=nowFiji();
  const prompt=`You sort quick voice notes for a Fiji family hub app used by Nakita and her partner Colin (daughter Bonnie, almost 4; dog Zeus). The person speaking is ${nm(me)}. Today is ${DOWL[dow(date)]} ${date} (Fiji time).
Split the note into separate items. Each item is one of:
- "todo": something someone needs to do. cat is "work", "home" (household and life) or "bonnie". who is "nakita", "colin" or "either" ("me"/"I" means ${me}; if they say to remind or ask the other person, it's ${other()}). due is YYYY-MM-DD resolved from words like "Monday" or "tomorrow" (the next upcoming date), or "" if none. time is HH:MM 24h or "". remind true if they say remind or the item has a specific day.
- "shopping": one item per thing to buy (title only, short).
- "message": something to tell ${nm(other())} that isn't a task.
- "saved": anything else worth keeping (idea, recipe note, link).
Keep titles short and plain, starting with a verb for to-dos.
Return only JSON: {"items":[{"type":"todo","title":"","cat":"home","who":"either","due":"","time":"","remind":false}]}

Note: """${noteDraft}"""`;
  try{
    const out=await sample.json(prompt,{modelTier:"quick",cache:false});
    const items=(out&&Array.isArray(out.items))?out.items:[];
    noteRes=items.filter(x=>x&&x.title).map(x=>({type:["todo","shopping","message","saved"].includes(x.type)?x.type:"saved",title:String(x.title).slice(0,140),cat:CATS[x.cat]?x.cat:"home",who:["nakita","colin","either"].includes(x.who)?x.who:me,due:/^\d{4}-\d{2}-\d{2}$/.test(x.due||"")?x.due:"",time:/^\d{2}:\d{2}$/.test(x.time||"")?x.time:"",remind:!!x.remind&&!!x.due,keep:true}));
    if(!noteRes.length){noteRes=null;noteErr="Claude couldn't find anything to sort. Try saying it a different way, or save it as a note."}
  }catch(e){
    noteErr=e&&e.code==="not_granted"?"Claude isn't allowed in this view. You can still save it as a note.":e&&e.code==="rate_limited"?"Claude is busy. Give it a minute and try again.":"Sorting didn't work just now. Your words are safe below. Try again, or save it straight as a to-do.";
  }
  noteBusy=false;render();
}
async function saveNote(){
  const keep=(noteRes||[]).filter(r=>r.keep!==false); if(!keep.length){noteRes=null;render();return}
  const remindFails=[];
  const ok=await guard(async()=>{
    for(const r of keep){
      if(r.type==="todo"){const ref=db.collection("items").doc();await ref.set({title:r.title,cat:r.cat,who:r.who,due:r.due,time:r.time,remind:r.remind,note:"",done:false,doneBy:"",doneAt:"",createdBy:me,createdAt:isoNow()});r._id=ref.id}
      else if(r.type==="shopping") await db.collection("lists").add({list:"shopping",text:r.title,done:false,by:me,at:isoNow()});
      else if(r.type==="message"){await db.collection("messages").add({from:me,text:r.title,at:isoNow()});window.hbNotify&&hbNotify({text:r.title});}
      else await db.collection("lists").add({list:"saved",text:r.title,by:me,at:isoNow()});
    }
  });
  if(!ok) return;
  for(const r of keep.filter(r=>r.type==="todo"&&r.remind&&r.due)){const x=await addReminder(r);if(x.ok&&x.id) guard(()=>db.doc("items/"+r._id).update({eventId:x.id}));else if(!x.ok) remindFails.push(x.msg)}
  noteRes=null;noteDraft="";route="home";render();window.scrollTo(0,0);
  toast(remindFails.length?`Saved. Reminders didn't go in: ${remindFails[0]}.`:"Sorted and saved.",{skull:true});
}

  else if(f.id==="billForm") saveBill();

  else if(f.id==="ratesForm"){const g=k=>Number(document.getElementById(k).value);const r={USD:g("r-usd")||RATES.USD,AUD:g("r-aud")||RATES.AUD,fee:g("r-fee")||0,checked:nowFiji().date};if(await guard(()=>db.doc("settings/rates").set(r))){RATES=r;closeSheet();render();toast("Rates saved.")}}
  else if(f.id==="chatForm"){const inp=document.getElementById("chatIn");const t=inp.value;inp.value="";if(!(await sendMessage(t))) inp.value=t}
  else if(f.id==="addList"){const inp=document.getElementById("listIn");const t=inp.value.trim();if(!t) return;inp.value="";const ok=await guard(()=>db.collection("lists").add(listTab==="shopping"?{list:"shopping",text:t,done:false,by:me,at:isoNow()}:{list:"saved",text:t,by:me,at:isoNow()}));if(!ok) inp.value=t}

});

/* rotating phone-down messages: one shortly after opening, then every few minutes while open */
function scheduleNudge(first){
  setTimeout(()=>{
    if(document.visibilityState==="visible"&&me&&!document.querySelector(".scrim,.nudge")){
      /* not every open gets one, so it stays a surprise */
      if(!first||Math.random()<0.6) toast(freshNudge(),{skull:true,btn:NUDGE_BTNS[Math.floor(Math.random()*NUDGE_BTNS.length)],ms:9000});
    }
    scheduleNudge(false);
  },first?3000+Math.random()*9000:(6+Math.random()*10)*60000);
}
setInterval(()=>{if(document.visibilityState==="visible"&&!document.querySelector(".scrim")&&route!=="note"&&route!=="chat") render()},60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();if(mcp&&cal.state!=="loading") loadCalendar(false)}});

/* ---------------- boot ---------------- */
me=store.get("me")||null;
routeFromHash();
render();
if(location.hash==="#nudge") setTimeout(showNudgeScreen,300);
scheduleNudge(true);

(async()=>{
  if(!window.claude||!window.claude.use) return;
  const [d,u,s,m,as,dl]=await Promise.all(["db","user","sample","mcp","assets","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  db=d; user=u; sample=s; mcp=m; assets=as; downloads=dl;
  if(user){
    try{
      let name=""; try{name=((await user.name())||"").toLowerCase()}catch(e){}
      let who=/colin/.test(name)?"colin":/nakita/.test(name)?"nakita":null;
      if(!who){ try{ if(await user.isOwner()) who="nakita"; }catch(e){} }
      if(who&&who!==me){me=who;store.set("me",me)}
      if(!who&&!store.get("me")){me=null;render()}
    }catch(e){}
    try{const w=await user.can("data.write"); if(w===false) canWrite=false}catch(e){}
  }
  if(!db){render();return}
  /* remember each Claude account as Nakita or Colin, shared across devices */
  try{
    uid=user?await user.id():null;
    if(uid){
      const snap=await db.doc("people/map").get();
      const map=(snap.exists&&snap.data())||{};
      if(map[uid]&&map[uid]!==me){me=map[uid];store.set("me",me);render()}
      else if(!map[uid]&&me){await db.doc("people/map").set(Object.assign({},map,{[uid]:me})).catch(()=>{})}
    }
  }catch(e){}
  const live=(q,fn)=>q.onSnapshot(fn,err=>{if(err&&err.code==="revoked"){db=null;render()}});
  let pending=4; const ready=()=>{if(--pending<=0){S.loaded=true}render()};
  live(db.collection("items"),snap=>{S.items=snap.docs.map(x=>Object.assign({id:x.id},x.data()));ready()});
  live(db.collection("chores"),snap=>{S.chores=snap.docs.map(x=>Object.assign({id:x.id},x.data()));ready()});
  live(db.collection("lists"),snap=>{S.lists=snap.docs.map(x=>Object.assign({id:x.id},x.data()));ready()});
  live(db.collection("messages").orderBy("at","desc").limit(150),snap=>{
    const before=S.messages.length;
    S.messages=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
    if(S.loaded&&S.messages.length>before&&route!=="chat"){const n=S.messages[0];if(n&&n.from!==me) msgToast(n)}
    ready();
  });
  const cutoff=new Date(Date.now()-400*864e5).toISOString();
  live(db.collection("chorelog").where("at",">=",cutoff),snap=>{const L={};snap.docs.forEach(x=>{L[x.id]=x.data()});S.log=L;render()});
  db.doc("settings/rates").onSnapshot(snap=>{if(snap.exists){RATES=Object.assign({},RATES,snap.data());render()}},()=>{});
  live(db.collection("bonnie").where("at",">=",new Date(Date.now()-21*864e5).toISOString()),snap=>{S.bonnie=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  live(db.collection("bills"),snap=>{S.bills=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  const dsheet=()=>document.querySelector("#dsForm,#cmtForm,#metaForm");
  live(db.collection("pages"),snap=>{S.pages=snap.docs.map(x=>Object.assign({id:x.id},x.data()));if(!dsheet())render()});
  live(db.collection("pagesec"),snap=>{S.pagesec=snap.docs.map(x=>Object.assign({id:x.id},x.data()));if(!dsheet())render()});
  live(db.collection("pcomments"),snap=>{S.pcomments=snap.docs.map(x=>Object.assign({id:x.id},x.data()));if(!dsheet())render()});
  live(db.collection("reviews"),snap=>{S.reviews=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  live(db.collection("rcomments"),snap=>{S.rcomments=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  live(db.collection("payments").where("date",">=",addMonths(nowFiji().date.slice(0,8)+"01",-12)),snap=>{S.payments=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  live(db.collection("spend").where("date",">=",addMonths(nowFiji().date.slice(0,8)+"01",-12)),snap=>{S.spend=snap.docs.map(x=>Object.assign({id:x.id},x.data()));render()});
  live(db.collection("habits").where("date",">=",addDays(nowFiji().date,-2)),snap=>{const H={};snap.docs.forEach(x=>{H[x.id]=x.data()});S.habits=H;render()});
  if(mcp) loadCalendar(false);
})();
})();
</script>
</body>
</html>
